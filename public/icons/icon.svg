<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Spice Up Your UK">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="union" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle Union Jack shield lines -->
  <g opacity="0.22">
    <path d="M96 96 L416 416 M416 96 L96 416" stroke="#60A5FA" stroke-width="28" stroke-linecap="round"/>
    <path d="M256 64 V448 M64 256 H448" stroke="#F43F5E" stroke-width="34" stroke-linecap="round"/>
  </g>
  <!-- Shield emblem -->
  <path d="M256 92 L392 142 V258 C392 346 332 406 256 436 C180 406 120 346 120 258 V142 Z"
        fill="#0B1120" stroke="url(#union)" stroke-width="14"/>
  <!-- Union cross inside shield -->
  <path d="M256 116 V412 M138 252 H374" stroke="#2563EB" stroke-width="26" opacity="0.45"/>
  <path d="M256 116 V412 M138 252 H374" stroke="#E11D48" stroke-width="14" opacity="0.85"/>
  <!-- Spice Crown -->
  <path d="M168 286 L152 198 L208 234 L256 174 L304 234 L360 198 L344 286 Z"
        fill="url(#crown)" stroke="#FFFBEB" stroke-width="6" stroke-linejoin="round"/>
  <rect x="168" y="294" width="176" height="24" rx="10" fill="url(#crown)"/>
  <!-- Sparkles -->
  <circle cx="256" cy="154" r="10" fill="#F472B6"/>
  <circle cx="150" cy="182" r="8" fill="#60A5FA"/>
  <circle cx="362" cy="182" r="8" fill="#F43F5E"/>
  <text x="256" y="372" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="2">SPICE</text>
</svg>
